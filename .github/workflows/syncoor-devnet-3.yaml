name: Syncoor - Devnet 3

on:
  schedule:
    - cron: '30 2 * * *'  # At 2:30am daily
  workflow_dispatch:
    inputs:
      el-client:
        description: 'Comma-separated list of execution layer clients (geth,besu,nethermind,erigon,reth)'
        required: false
        default: '"geth","reth","nethermind","besu","erigon"'
        type: string
      cl-client:
        description: 'Comma-separated list of consensus layer clients (lighthouse,teku,prysm,nimbus,lodestar,grandine)'
        required: false
        default: '"lighthouse","teku","prysm","nimbus","lodestar","grandine"'
        type: string
      run-timeout:
        description: 'Timeout for the sync test (in minutes)'
        required: false
        default: '1800'
        type: string
      checkpoint-sync-enabled:
        description: 'Enable checkpoint sync'
        required: false
        default: true
        type: boolean
      checkpoint-sync-url:
        description: 'Checkpoint sync URL'
        required: false
        default: 'https://checkpoint-sync.fusaka-devnet-3.ethpandaops.io'
        type: string
      supernode:
        description: 'Enable supernode mode'
        required: false
        default: false
        type: boolean
      image:
        description: 'Syncoor Docker image'
        required: false
        default: 'docker.ethquokkaops.io/dh/ethpandaops/syncoor:master'
        type: string
      git-ref:
        description: 'Git reference (branch, tag, or commit) to checkout'
        required: false
        default: ''
        type: string
      el-image:
        description: 'Execution layer client images as JSON (e.g., {"geth": "ethereum/client-go:latest", "besu": "hyperledger/besu:latest"})'
        required: false
        default: >-
          {
            "besu": "ethpandaops/besu:main",
            "geth": "ethpandaops/geth:master",
            "erigon": "ethpandaops/erigon:main",
            "nethermind": "ethpandaops/nethermind:master",
            "reth": "ethpandaops/reth:main",
            "nimbusel": "ethpandaops/nimbus-eth1:master"
          }
        type: string
      cl-image:
        description: 'Consensus layer client images as JSON (e.g., {"lighthouse": "sigp/lighthouse:latest", "teku": "consensys/teku:latest"})'
        required: false
        default: >-
          {
            "lighthouse": "ethpandaops/lighthouse:unstable",
            "teku": "consensys/teku:latest",
            "prysm": "ethpandaops/prysm:unstable",
            "nimbus": "ethpandaops/nimbus-eth2:fusaka-devnet-3",
            "lodestar": "ethpandaops/lodestar:unstable",
            "grandine": "ethpandaops/grandine:unstable"
          }
        type: string

env:
  INSTALL_RCLONE_VERSION: v1.68.2
  S3_BUCKET: ethpandaops-syncoor-data
  DEFAULT_CHECKPOINT_SYNC_URL: https://checkpoint-sync.fusaka-devnet-3.ethpandaops.io

jobs:
  sync:
    # Timeouts from h to minutes:
    # - 4h -> 240m
    # - 6h -> 360m
    # - 8h -> 480m
    # - 12h -> 720m
    # - 24h -> 1440m
    # - 48h -> 2880m
    # - 72h -> 4320m
    timeout-minutes: ${{ github.event_name == 'schedule' && 240 || fromJSON(inputs.run-timeout || '1800') }}
    # Self-hosted runner sizes:
    # - ccx13: 2 cores, 8GB, 80GB disk
    # - ccx23: 4 cores, 16GB, 160GB disk
    # - ccx33: 8 cores, 32GB, 240GB disk
    # - ccx43: 16 cores, 64GB, 360GB disk
    runs-on: self-hosted-ghr-size-ccx33-x64
    #concurrency:
    #  group: >-
    #    ${{ matrix.network }}-${{ matrix.el-client }}-${{ matrix.cl-client }}
    strategy:
      fail-fast: false
      matrix:
        network: ["fusaka-devnet-3"]
        el-client: >-
          ${{
            fromJSON(format('[{0}]', inputs.el-client || '
              "besu",
              "erigon",
              "geth",
              "nethermind",
              "reth"
          '))}}
        cl-client: >-
          ${{
            fromJSON(format('[{0}]', inputs.cl-client || '
              "lighthouse",
              "teku",
              "prysm",
              "nimbus",
              "lodestar",
              "grandine"
          '))}}

    steps:
    - name: Set default images for scheduled runs
      id: default-images
      if: github.event_name == 'schedule'
      run: |
        cat > /tmp/default-el-images.json <<'EOF'
        {
          "besu": "ethpandaops/besu:main",
          "geth": "ethpandaops/geth:master",
          "erigon": "ethpandaops/erigon:main",
          "nethermind": "ethpandaops/nethermind:master",
          "reth": "ethpandaops/reth:fusaka-devnet-3",
          "nimbusel": "ethpandaops/nimbus-eth1:master"
        }
        EOF
        echo "el-images=$(cat /tmp/default-el-images.json | jq -c .)" >> $GITHUB_OUTPUT

    - name: Prepare inputs
      id: prepare
      env:
        EL_IMAGES: ${{ github.event_name == 'schedule' && steps.default-images.outputs.el-images || inputs.el-image }}
        CL_IMAGES: ${{ inputs.cl-image }}
      run: |
        # Parse EL image for current client
        if [ "$EL_IMAGES" != '{}' ] && [ -n "$EL_IMAGES" ]; then
          EL_IMAGE=$(echo "$EL_IMAGES" | jq -r --arg client "${{ matrix.el-client }}" '.[$client] // ""')
          echo "el-image=$EL_IMAGE" >> $GITHUB_OUTPUT
        else
          echo "el-image=" >> $GITHUB_OUTPUT
        fi

        # Parse CL image for current client
        if [ "$CL_IMAGES" != '{}' ] && [ -n "$CL_IMAGES" ]; then
          CL_IMAGE=$(echo "$CL_IMAGES" | jq -r --arg client "${{ matrix.cl-client }}" '.[$client] // ""')
          echo "cl-image=$CL_IMAGE" >> $GITHUB_OUTPUT
        else
          echo "cl-image=" >> $GITHUB_OUTPUT
        fi

        # Calculate timeout (subtract 10 minutes)
        TIMEOUT=$(( ${{ github.event_name == 'schedule' && 240 || fromJSON(inputs.run-timeout || '1800') }} - 10 ))
        echo "run-timeout=$TIMEOUT" >> $GITHUB_OUTPUT

    - name: Run Syncoor Test
      uses: ethpandaops/syncoor@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        server: https://syncoor-api.fusaka-devnet-3.ethpandaops.io
        server-auth: ${{ secrets.SYNCOOR_SERVER_AUTH }}
        log-force-colors: true
        client-logs: true
        public: true
        network: ${{ matrix.network }}
        el-client: ${{ matrix.el-client }}
        cl-client: ${{ matrix.cl-client }}
        el-image: ${{ steps.prepare.outputs.el-image }}
        cl-image: ${{ steps.prepare.outputs.cl-image }}
        el-extra-args: >-
          ${{
            (matrix.el-client == 'reth') && '["--full"]' ||
            (matrix.el-client == 'erigon') && '["--prune.mode=full"]' ||
            '[]'
          }}
        check-interval: 30s
        run-timeout: ${{ steps.prepare.outputs.run-timeout }}m
        log-level: info
        s3-upload: true
        s3-bucket: ${{ env.S3_BUCKET }}
        s3-path: devnets/${{ matrix.network }}
        rclone-config: ${{ secrets.SYNCOOR_RCLONE_CONFIG }}
        rclone-version: ${{ env.INSTALL_RCLONE_VERSION }}
        checkpoint-sync-enabled: ${{ github.event_name == 'schedule' && true || inputs.checkpoint-sync-enabled }}
        checkpoint-sync-url: ${{ inputs.checkpoint-sync-url || env.DEFAULT_CHECKPOINT_SYNC_URL }}
        supernode: ${{ inputs.supernode }}
        image: ${{ inputs.image || 'docker.ethquokkaops.io/dh/ethpandaops/syncoor:master' }}
        git-ref: ${{ inputs.git-ref }}

    - name: Update test results index
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'syncoor-generate-index.yaml',
            ref: context.ref,
            inputs: {
              's3-path': 'devnets/${{ matrix.network }}'
            }
          });
