
# enable traces
lighthouse_container_command_extra_args:
  - --testnet-dir=/network-config
  - --boot-nodes={{ ethereum_cl_bootnodes | join(',') }}
  #- --debug-level=debug
  - --telemetry-collector-url={{ tempo_grpc_url }}
  - --telemetry-service-name={{ ethereum_network_name }}-{{ inventory_hostname }}
  - --reconstruct-historic-states


default_ethereum_client_images:
### Consensus layer clients
  lighthouse: ethpandaops/lighthouse:unstable-4efe47b
### Execution layer clients
  besu: ethpandaops/besu:main

